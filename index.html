<!doctype html>
<html lang="kaa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive panel demonstrating JavaScript events and interface states.">
  <title>Interactive Panel</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main>
    <h1 id="hello-screen" hidden>HELLO!</h1>
    <button id="resetHello" class="reset-hello" type="button" onclick="resetPanel()" hidden>Return to panel</button>

    <section class="box" id="mainBox" aria-label="Interactive control panel">
      <div class="overlay-loading" id="loadingOverlay" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>LOADING...</p>
      </div>

      <div class="overlay-emoji" id="emojiOverlay" aria-hidden="true">😊</div>

      <div id="input-box">
        <label for="messageInput">Maǵlıwmat kiritiń</label>
        <input id="messageInput" type="text" maxlength="120" placeholder="Maǵlıwmat kiritiń...">
      </div>

      <div class="col col-left" aria-label="First set of actions">
        <button class="num-card" type="button" onclick="action1()" aria-label="Toggle text input">1</button>
        <button class="num-card" type="button" onclick="action2()" aria-label="Show loading animation">2</button>
        <button class="num-card" type="button" onclick="action3()" aria-label="Hide panel">3</button>
      </div>

      <button class="off-btn" type="button" onclick="resetPanel()">RESET</button>

      <div class="col col-right" aria-label="Second set of actions">
        <button class="num-card" type="button" onclick="action4()" aria-label="Highlight panel">4</button>
        <button class="num-card" type="button" onclick="action5()" aria-label="Show emoji overlay">5</button>
        <button class="num-card" type="button" onclick="action6()" aria-label="Highlight all buttons">6</button>
      </div>
    </section>
  </main>

  <script>
    const box = document.getElementById("mainBox");
    const loading = document.getElementById("loadingOverlay");
    const emoji = document.getElementById("emojiOverlay");
    const hello = document.getElementById("hello-screen");
    const resetHello = document.getElementById("resetHello");
    const inputBox = document.getElementById("input-box");

    function action1() {
      inputBox.style.display = inputBox.style.display === "grid" ? "none" : "grid";
      if (inputBox.style.display === "grid") {
        document.getElementById("messageInput").focus();
      }
    }

    function action2() {
      loading.style.display = "flex";
      window.setTimeout(() => {
        loading.style.display = "none";
      }, 1800);
    }

    function action3() {
      box.style.transform = "scale(0) rotate(-180deg)";
      box.style.opacity = "0";
      window.setTimeout(() => {
        box.hidden = true;
        hello.hidden = false;
        resetHello.hidden = false;
      }, 450);
    }

    function action4() {
      box.style.borderColor = "#ffffff";
      window.setTimeout(() => {
        box.style.borderColor = "";
      }, 900);
    }

    function action5() {
      emoji.style.display = "flex";
      window.setTimeout(() => {
        emoji.style.display = "none";
      }, 1400);
    }

    function action6() {
      const cards = document.querySelectorAll(".num-card");
      cards.forEach((card) => card.classList.add("glow-active"));
      window.setTimeout(() => {
        cards.forEach((card) => card.classList.remove("glow-active"));
      }, 1400);
    }

    function resetPanel() {
      box.hidden = false;
      box.style.transform = "";
      box.style.opacity = "";
      box.style.borderColor = "";
      hello.hidden = true;
      resetHello.hidden = true;
      loading.style.display = "none";
      emoji.style.display = "none";
      inputBox.style.display = "none";
      document.getElementById("messageInput").value = "";
      document.querySelectorAll(".num-card").forEach((card) => {
        card.classList.remove("glow-active");
      });
    }
  </script>
</body>
</html>
